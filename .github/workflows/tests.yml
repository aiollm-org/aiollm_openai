name: tests

on:
  push:
    branches: [master]
  pull_request:
    # labeled/unlabeled too, so a "no changelog" label added after the
    # pull request opened reaches the changelog check.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pyright
      - run: uv run pytest --mypy -m mypy tests/typing
      - run: >-
          uv run rumdl check README.md CHANGELOG.md CONTRIBUTING.md
          CLAUDE.md .claude
      # The types are what the pinned generator makes of the pinned
      # OpenAPI file: regenerating them changes nothing.
      - run: uv run python scripts/generate_types.py
      - run: git add --intent-to-add . && git diff --exit-code

  test-matrix:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every CPython the package supports (requires-python >= 3.13);
        # 3.13, the oldest, is also what .python-version pins locally.
        python: ["3.13", "3.14", "3.15"]
    env:
      # For every uv command of the job: with only `uv sync --python`,
      # `uv run` would take .python-version's 3.13 and rebuild the
      # environment without the test group.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # The generator only runs in the job above.
      - run: uv sync --all-groups --no-group codegen --locked
      - run: >-
          uv run pytest --cov --cov-branch --cov-report=xml
          --html=report.html --self-contained-html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ matrix.os }}-${{ matrix.python }}
          path: |
            coverage.xml
            report.html

  tests:
    # One stable name for the branch ruleset, whatever the matrix holds.
    name: tests
    if: always()
    needs: [test-matrix]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-matrix.result }}" = "success"

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      # Three clean environments, every package from a wheel (no sdist is
      # built): this wheel with the core it brings from PyPI; the core
      # alone, at that version; and both providers on that core, the other
      # one from PyPI without its dependencies (its own range of the core
      # may lag behind this branch's).
      - name: This wheel with the core it brings
        run: |
          uv venv --python 3.13 .wheel-env
          uv pip install --python .wheel-env --only-binary :all: dist/*.whl
          .wheel-env/bin/python - <<'EOF'
          import sys
          from importlib.metadata import version

          import aiollm_openai
          from aiollm.testing.extension import check_extension_api

          assert aiollm_openai.__version__ == version("aiollm-openai"), (
              aiollm_openai.__version__,
              version("aiollm-openai"),
          )
          assert check_extension_api("aiollm_openai") == []
          assert "pytest" not in sys.modules
          print(
              "aiollm-openai",
              aiollm_openai.__version__,
              "imports from its wheel on aiollm-core",
              version("aiollm-core"),
          )
          EOF
          .wheel-env/bin/python -c 'from importlib.metadata import version; print(version("aiollm-core"))' > core-version
      - name: The core alone
        run: |
          uv venv --python 3.13 .core-env
          uv pip install --python .core-env --only-binary :all: "aiollm-core==$(cat core-version)"
          .core-env/bin/python - <<'EOF'
          import sys

          import aiollm

          # The core loads no transport and no provider on import.
          loaded = [
              name
              for name in sys.modules
              if name == "aiohttp" or name.startswith("aiollm_")
          ]
          assert loaded == [], loaded
          print("aiollm-core", aiollm.__version__, "imports alone")
          EOF
      - name: Both providers on this core
        run: |
          uv venv --python 3.13 .both-env
          uv pip install --python .both-env --only-binary :all: dist/*.whl
          uv pip install --python .both-env --only-binary :all: --no-deps aiollm-anthropic
          .both-env/bin/python - <<'EOF'
          from importlib.metadata import version

          import aiollm_openai
          import aiollm_anthropic
          from aiollm.testing.extension import check_extension_api

          assert check_extension_api("aiollm_openai") == []
          assert check_extension_api("aiollm_anthropic") == []
          assert aiollm_openai.api.PROVIDER != aiollm_anthropic.api.PROVIDER
          print(
              "aiollm-openai",
              version("aiollm-openai"),
              "and aiollm-anthropic",
              version("aiollm-anthropic"),
              "on aiollm-core",
              version("aiollm-core"),
          )
          EOF

  changelog:
    # A pull request adds a fragment to CHANGES/ (or, for a release,
    # changes CHANGELOG.md itself); the "no changelog" label skips the
    # check for a change no user sees.
    name: changelog
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'no changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: >-
          uv run --locked --only-group dev
          towncrier check --compare-with origin/${{ github.base_ref }}

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      # Known vulnerabilities in every locked dependency, dev tools too.
      # An exception is an --ignore <ID> with its reason in a comment
      # (rule, reason, scope, owner, review condition: manifest §18).
      - run: uv audit --locked --preview-features audit-command
